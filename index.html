<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Paint the document dark before ANY external CSS or script loads, so
         there is never a white frame on load/navigation. Light mode removes
         the class below. This inline style beats the CSS-file load gap. -->
    <style>
      html {
        --loader-bg: #171310;
        --loader-ink: #f3ecde;
        --loader-rule: #514a3c;
        --loader-accent: #c4aa7c;
        background-color: var(--loader-bg);
      }
      html.light-mode {
        --loader-bg: #f3efe7;
        --loader-ink: #272219;
        --loader-rule: #cfc4ad;
        --loader-accent: #7a5a22;
      }
      /* Skip link: must be invisible from the FIRST frame, so its hiding lives
         here inline — the compiled stylesheet arrives too late during the
         initial loading screen and the link would flash as a raw blue anchor.
         Appears only on keyboard focus. */
      .skip-link {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
      .skip-link:focus {
        position: fixed; top: 8px; left: 8px; z-index: 9999;
        width: auto; height: auto; margin: 0; padding: 8px 16px;
        clip: auto; overflow: visible; white-space: normal;
        background: #262321; color: #f5f4f0; text-decoration: none;
        outline: 2px solid #c4aa7c;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mandala Codes · Universal Language Oracle</title>

    <meta name="description" content="A reading deck of 64 mandalas. Each card connects to a hexagram from the I Ching, a Gene Key, and a Human Design gate. Open a card and receive what it holds." />
    <meta name="author" content="Adrian Rasmussen" />
    <meta name="theme-color" content="#141210" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mandala Codes" />
    <meta property="og:title" content="Mandala Codes · Universal Language Oracle" />
    <meta property="og:description" content="A reading deck of 64 mandalas. Each card connects to a hexagram from the I Ching, a Gene Key, and a Human Design gate." />
    <meta property="og:image" content="https://res.cloudinary.com/dobbosnda/image/upload/f_auto,q_auto,w_1200,h_630,c_fill,g_auto/48_ttflpq" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mandala Codes · Universal Language Oracle" />
    <meta name="twitter:description" content="A reading deck of 64 mandalas. Each card connects to a hexagram from the I Ching, a Gene Key, and a Human Design gate." />
    <meta name="twitter:image" content="https://res.cloudinary.com/dobbosnda/image/upload/f_auto,q_auto,w_1200,h_630,c_fill,g_auto/48_ttflpq" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Speculative prerender: when the visitor hovers/touches the Learn link,
         the browser fully renders /learn in the background, so the actual
         click swaps to a finished page — near-instant, and the cross-document
         transition plays over it. "moderate" = only on hover intent, so no
         bandwidth is spent speculatively on page load. Browsers without
         support ignore this block entirely. -->
    <script type="speculationrules">
      {
        "prerender": [
          {
            "where": { "href_matches": "/learn*" },
            "eagerness": "moderate"
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preload" href="/fonts/cormorant-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/iowan-old-style-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The Latin reading families and Oracle CJK roles are self-hosted (see the
         @font-face block appended to src/theme.css) so this surface and the
         /learn library reference identical /fonts/... URLs and never repaint
         on crossing. The bundled CJK subset provides the Oracle's established
         Chinese role without a runtime dependency on Google Fonts. -->

    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://mandalacodes.com/#website",
  "name": "Mandala Codes",
  "url": "https://mandalacodes.com",
  "inLanguage": "en",
  "description": "A reading deck of 64 mandalas, connecting the I Ching, Gene Keys, and Human Design into a single contemplative oracle."
}
</script>
  </head>
  <body>
    <!-- CSP: the inline script below is allowlisted by sha256 hash in
         public/_headers (script-src). Editing ANY byte of its body changes the
         hash — recompute and update _headers, or the browser blocks it. -->
    <script>
      (function() {
        // Default to dark (matches DarkModeProvider). Only light when the
        // visitor has explicitly chosen it — applied before first paint so
        // there is no dark->light->dark flash on navigation.
        var dark = localStorage.getItem('dark-mode') !== 'false';
        var root = document.documentElement;
        root.classList.add(dark ? 'dark' : 'light-mode');
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#141210' : '#f3efe7');
      })();
    </script>
    <a href="#main-content" class="skip-link" style="font-family:var(--font-ui);font-size:12px;letter-spacing:0.2em;text-transform:uppercase;">Skip to main content</a>
    <div id="root">
        <div class="initial-loader" style="height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; background-color: var(--loader-bg); color: var(--loader-ink); font-family: var(--font-technical); flex-direction: column; gap: 20px;">
            <div style="width: 40px; height: 40px; border: 2px solid var(--loader-rule); border-top-color: var(--loader-accent); border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <div id="loader-status" style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--loader-accent);">Opening the deck...</div>
            <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>
    <div class="noise-overlay"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
