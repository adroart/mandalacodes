    <!-- Paint the document dark before ANY external CSS or script loads, so
         there is never a white frame on load/navigation. Light mode removes
         the class below. This inline style beats the CSS-file load gap. -->

      html { background-color: #171310; }
      html.light-mode { background-color: #f5f4f0; }
    </style>

  </head>
  <body class="bg-[#262321]">
    <script>
      (function() {
        // Default to dark (matches DarkModeProvider). Only light when the
        // visitor has explicitly chosen it — applied before first paint so
        // there is no dark->light->dark flash on navigation.
        if (localStorage.getItem('dark-mode') !== 'false') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.add('light-mode');
        }
      })();
    </script>
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[9999] focus:px-4 focus:py-2 focus:bg-[#262321] focus:text-[#f5f4f0] focus:outline-2 focus:outline-[#c4aa7c]" style="font-family:'Josefin Sans',sans-serif;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;">Skip to main content</a>
    <div id="root">
        <div class="initial-loader" style="height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; background-color: #262321; color: #f5f4f0; font-family: monospace; flex-direction: column; gap: 20px;">
            <div style="width: 40px; height: 40px; border: 2px solid #524330; border-top-color: #b0966b; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <div id="loader-status" style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #b0966b;">Opening the deck...</div>
            <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>
    <div class="noise-overlay"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
