# CI: typecheck + unit tests + the mobile Playwright suite on main pushes and PRs.
name: test

on:
  push:
    branches: [main]
    # Prose never changes what the suite proves; every skipped run is minutes
    # kept for a run that matters (the account ran out in September 2026).
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'todo/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'todo/**'

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the suite when a push to main is a PR merge whose tree is byte-for-byte
  # the tree this workflow already passed on the PR head (the case whenever the
  # PR was up to date with main). Re-running it proved nothing and cost a full
  # run per merge: in September 2026 that doubling took the account past its
  # free Actions minutes. A direct push, a merge whose tree differs from the PR
  # head, or a head with no green run all still run everything.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # The default token cannot list runs; without this the lookup silently
    # returns nothing and the gate never skips (seen on the first merge).
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=true; why="not a push to main"
          if [ "${{ github.event_name }}" = push ]; then
            why="direct push"
            if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -ge 3 ]; then
              head="$(git rev-parse HEAD^2)"
              if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "${head}^{tree}")" ]; then
                # workflow_ref is owner/repo/.github/workflows/<file>@refs/heads/<branch>
                wf="${{ github.workflow_ref }}"; wf="${wf%%@*}"; wf="${wf##*/}"
                green="$(gh run list --workflow="$wf" --commit="$head" --json conclusion --jq '[.[] | select(.conclusion=="success")] | length' 2>&1 || true)"
                case "$green" in ''|*[!0-9]*) echo "gate: run lookup failed: $green"; green=0;; esac
                if [ "${green:-0}" -gt 0 ]; then run=false; why="merge of $head, same tree, already green"; else why="merge of $head, same tree, but no green run on it"; fi
              else
                why="merge whose tree differs from the PR head"
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "gate: run=$run ($why)"
  test:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The MCP oracle server is its own package; the root typecheck
      # includes mcp/oracle-server/src, so its deps must be present.
      - run: npm ci --prefix mcp/oracle-server
      - run: npm run typecheck
      # Deck-wide count of the writer's brief never-dos; a report, not a gate,
      # until Phase 1 of todo/plans/personal-pass.md brings it to its clean line.
      - run: npm run lint:tells
      - run: npm run test:unit

  # The mobile Playwright suite, on Chromium only (playwright.config.ts's
  # `Mobile Chrome` project). It was reading as broadly red because nothing
  # started the app before it ran (2026-09-02 decision, TODO.md) — the config
  # now boots the Vite dev server itself (webServer block) before any test
  # runs. Measured locally at ~9.5 minutes for this one project, almost all of
  # it 30s test-timeouts in tests/oracle-reflection-recorder.spec.ts: that
  # file's admin recorder bar shares a CSS class (`.oracle-bottom-nav`) that
  # card-reading-fullbleed.css force-hides for every reading page (see the
  # 2026-07-20 "one bottom bar, not two" redesign), so its controls are
  # unreachable by a real click and most of its tests were never green after
  # that commit. That is a real, pre-existing product/test mismatch (not
  # something this job introduces or should paper over) — see this branch's
  # PR description for the full list. Left enabled deliberately so CI reflects
  # the true state rather than hiding it; a 20-minute budget covers it.
  test-mobile:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Reports without blocking until the 35 pre-existing failures listed in
    # TODO.md ("Found in the 2026-09-08 mobile suite audit") are resolved, so
    # main's status stays a true signal from the checks that can pass.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-mobile-report
          path: test-results/
          retention-days: 7
