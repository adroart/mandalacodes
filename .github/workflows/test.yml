# Minimal CI: typecheck + unit tests on main pushes and PRs.
# The Playwright e2e suite is not run here — it needs a built site and
# browsers; this workflow guards the pure logic (ledger, projection,
# kinship, privacy) that the Atlas depends on.
name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The MCP oracle server is its own package; the root typecheck
      # includes mcp/oracle-server/src, so its deps must be present.
      - run: npm ci --prefix mcp/oracle-server
      - run: npm run typecheck
      - run: npm run test:unit
