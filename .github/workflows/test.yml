# CI: typecheck + unit tests + the mobile Playwright suite on main pushes and PRs.
name: test

on:
  push:
    branches: [main]
    # Prose never changes what the suite proves; every skipped run is minutes
    # kept for a run that matters (the account ran out in September 2026).
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'todo/**'
  # Pull requests always start this workflow, even prose-only ones: main
  # requires gate, test and test-mobile to report before a merge, and a
  # workflow that never starts never reports, so the PR would wait forever.
  # The gate below skips the two suites for prose-only PRs instead, and GitHub
  # counts a skipped required job as passed.
  pull_request:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the suite when a push to main is a PR merge whose tree is byte-for-byte
  # the tree this workflow already passed on the PR head (the case whenever the
  # PR was up to date with main). Re-running it proved nothing and cost a full
  # run per merge: in September 2026 that doubling took the account past its
  # free Actions minutes. A direct push, a merge whose tree differs from the PR
  # head, or a head with no green run all still run everything.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # The default token cannot list runs; without this the lookup silently
    # returns nothing and the gate never skips (seen on the first merge).
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=true; why="not a push to main"
          if [ "${{ github.event_name }}" = pull_request ]; then
            why="pull request"
            # The same prose-only rule push uses (root *.md, docs/, todo/),
            # applied to the PR's files. A lookup failure runs everything.
            files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' 2>&1)" || files=""
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^([^/]+\.md|docs/.*|todo/.*)$'; then
              run=false; why="prose-only pull request"
            fi
          fi
          if [ "${{ github.event_name }}" = push ]; then
            why="direct push"
            if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -ge 3 ]; then
              head="$(git rev-parse HEAD^2)"
              if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "${head}^{tree}")" ]; then
                # workflow_ref is owner/repo/.github/workflows/<file>@refs/heads/<branch>
                wf="${{ github.workflow_ref }}"; wf="${wf%%@*}"; wf="${wf##*/}"
                green="$(gh run list --workflow="$wf" --commit="$head" --json conclusion --jq '[.[] | select(.conclusion=="success")] | length' 2>&1 || true)"
                case "$green" in ''|*[!0-9]*) echo "gate: run lookup failed: $green"; green=0;; esac
                if [ "${green:-0}" -gt 0 ]; then run=false; why="merge of $head, same tree, already green"; else why="merge of $head, same tree, but no green run on it"; fi
              else
                why="merge whose tree differs from the PR head"
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "gate: run=$run ($why)"
  test:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The MCP oracle server is its own package; the root typecheck
      # includes mcp/oracle-server/src, so its deps must be present.
      - run: npm ci --prefix mcp/oracle-server
      - run: npm run typecheck
      # Deck-wide count of the writer's brief never-dos; a report, not a gate,
      # until Phase 1 of todo/plans/personal-pass.md brings it to its clean line.
      - run: npm run lint:tells
      - run: npm run test:unit

  # The current-frame mobile checks use Vite dev. Offline QR and Learn routing
  # require the actual generated worker and run against production preview.
  # Build once before either lane so their static Learn assets are identical.
  test-mobile:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Playwright owns the 18-minute mobile budget so it can still write JSON;
    # the job has room to build, summarize, run the PWA checks, and upload.
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # --global-timeout 18m: Playwright stops itself and still reports.
      # --reporter=list,json: the list output stays readable in the log, and
      # the JSON is what the summary counts. The later --reporter wins over
      # the one inside the npm script.
      - run: npm run test:mobile -- --reporter=list,json --global-timeout=1080000
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: mobile-results.json
      # always(): a red suite, a suite cut short by its own budget, and a
      # green one all get counted. This is the only place the lane's result is
      # stated, so it must not be conditional on which way the lane went.
      - if: always()
        run: node scripts/mobile-lane-summary.mjs mobile-results.json
      - if: always()
        run: npm run test:pwa
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-mobile-report
          path: |
            mobile-results.json
            test-results/
          retention-days: 7
          if-no-files-found: ignore
