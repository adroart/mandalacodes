# CI: typecheck + unit tests + the mobile Playwright suite on main pushes and PRs.
name: test

on:
  push:
    branches: [main]
    # Prose never changes what the suite proves; every skipped run is minutes
    # kept for a run that matters (the account ran out in September 2026).
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'todo/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'todo/**'

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the suite when a push to main is a PR merge whose tree is byte-for-byte
  # the tree this workflow already passed on the PR head (the case whenever the
  # PR was up to date with main). Re-running it proved nothing and cost a full
  # run per merge: in September 2026 that doubling took the account past its
  # free Actions minutes. A direct push, a merge whose tree differs from the PR
  # head, or a head with no green run all still run everything.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # The default token cannot list runs; without this the lookup silently
    # returns nothing and the gate never skips (seen on the first merge).
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=true; why="not a push to main"
          if [ "${{ github.event_name }}" = push ]; then
            why="direct push"
            if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -ge 3 ]; then
              head="$(git rev-parse HEAD^2)"
              if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "${head}^{tree}")" ]; then
                # workflow_ref is owner/repo/.github/workflows/<file>@refs/heads/<branch>
                wf="${{ github.workflow_ref }}"; wf="${wf%%@*}"; wf="${wf##*/}"
                green="$(gh run list --workflow="$wf" --commit="$head" --json conclusion --jq '[.[] | select(.conclusion=="success")] | length' 2>&1 || true)"
                case "$green" in ''|*[!0-9]*) echo "gate: run lookup failed: $green"; green=0;; esac
                if [ "${green:-0}" -gt 0 ]; then run=false; why="merge of $head, same tree, already green"; else why="merge of $head, same tree, but no green run on it"; fi
              else
                why="merge whose tree differs from the PR head"
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "gate: run=$run ($why)"
  test:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The MCP oracle server is its own package; the root typecheck
      # includes mcp/oracle-server/src, so its deps must be present.
      - run: npm ci --prefix mcp/oracle-server
      - run: npm run typecheck
      # Deck-wide count of the writer's brief never-dos; a report, not a gate,
      # until Phase 1 of todo/plans/personal-pass.md brings it to its clean line.
      - run: npm run lint:tells
      - run: npm run test:unit

  # The mobile Playwright suite, on Chromium only (playwright.config.ts's
  # `Mobile Chrome` project). It was reading as broadly red because nothing
  # started the app before it ran (2026-09-02 decision, TODO.md) — the config
  # now boots the Vite dev server itself (webServer block) before any test
  # runs. Measured locally at ~9.5 minutes for this one project, almost all of
  # it 30s test-timeouts in tests/oracle-reflection-recorder.spec.ts: that
  # file's admin recorder bar shares a CSS class (`.oracle-bottom-nav`) that
  # card-reading-fullbleed.css force-hides for every reading page (see the
  # 2026-07-20 "one bottom bar, not two" redesign), so its controls are
  # unreachable by a real click and most of its tests were never green after
  # that commit. That is a real, pre-existing product/test mismatch (not
  # something this job introduces or should paper over) — see this branch's
  # PR description for the full list. Left enabled deliberately so CI reflects
  # the true state rather than hiding it. Re-measured 2026-09-22 on main
  # (b9da484): 41 failed, 80 passed, 10 skipped of 131, in 11.6 minutes. A CI
  # runner is slower: the same suite took 18m22s on run 35190547827.
  test-mobile:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Reports without blocking until the 35 pre-existing failures listed in
    # TODO.md ("Found in the 2026-09-08 mobile suite audit") are resolved, so
    # main's status stays a true signal from the checks that can pass.
    #
    # The price of that, and it was being paid silently: this keeps the RUN's
    # conclusion at success even while this job's own conclusion is failure,
    # so the run badge — the thing anyone actually looks at — says nothing
    # about the lane. Main carried a red lane under a green run from
    # 2026-09-15 to 2026-09-17 (runs 35174697859, 35190547827: job failure,
    # run success) and no surface said so. The "Mobile Chrome lane" block the
    # report step writes to the run summary is now that surface, on every
    # path, and it is where this lane's result is read. Not the run badge.
    continue-on-error: true
    # 24, not 20, purely so the reporting steps below can still run after a
    # long suite. This is NOT the suite being given longer to pass: the suite's
    # own budget is --global-timeout below, and at 18 minutes it is TIGHTER than
    # the ~19m14s a 20-minute cap left it after setup. What it buys is that an
    # overrun ends inside Playwright, which writes its report, instead of the
    # runner killing the job at the cap — which is what happened on run
    # 35070372247 (20m15s), and a killed job skips every later step, so that
    # run produced no counts, no artifact and no record of what failed.
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # --global-timeout 18m: Playwright stops itself and still reports.
      # --reporter=list,json: the list output stays readable in the log, and
      # the JSON is what the summary counts. The later --reporter wins over
      # the one inside the npm script.
      - run: npm run test:mobile -- --reporter=list,json --global-timeout=1080000
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: mobile-results.json
      # always(): a red suite, a suite cut short by its own budget, and a
      # green one all get counted. This is the only place the lane's result is
      # stated, so it must not be conditional on which way the lane went.
      - if: always()
        run: node scripts/mobile-lane-summary.mjs mobile-results.json
      # Was if: failure(), which never matched the two paths that most needed
      # the evidence: a job killed at the cap (cancelled, not failed) and a run
      # superseded by concurrency. Runs 35070372247, 35072415647 and
      # 35105950236 all lost their report that way.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-mobile-report
          path: |
            mobile-results.json
            test-results/
          retention-days: 7
          if-no-files-found: ignore
