name = "mandalacodes"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# R2 bucket for the Atlas ledger (city-level world map of where every UL piece lives).
# Provisioned 2026-05-24 via `wrangler r2 bucket create mandalacodes-atlas`.
# Three JSON objects live in here:
#   atlas/ledger.json   — append-only LedgerEvent[]
#   atlas/stewards.json — private StewardRecord[] (never served publicly)
#   atlas/public.json   — derived PublicAtlasState, regenerated after every write
[[r2_buckets]]
binding = "ATLAS_BUCKET"
bucket_name = "mandalacodes-atlas"

# D1 database — provisioned 2026-05-23 via `wrangler d1 create mandalacodes-oracle`.
# Region: APAC. Used by future accounts work (Phase 1b — Clerk + birthdate energy panels).
# No tables yet; v1 oracle reader is stateless and does not query DB.
[[d1_databases]]
binding = "DB"
database_name = "mandalacodes-oracle"
database_id = "c8d07902-f80a-4c84-a82e-7d70dad34672"
migrations_dir = "migrations"

# KV namespace for the Lightweaver relay. Holds per-card state + pending
# commands. Customer browser writes commands, card polls for them.
# Provisioned at deploy time via:
#   wrangler kv:namespace create LIGHTWEAVER_RELAY
# Then paste the returned id into the `id` field below.
[[kv_namespaces]]
binding = "LIGHTWEAVER_RELAY"
id = "PLACEHOLDER_RUN_WRANGLER_KV_CREATE_THEN_PASTE_ID_HERE"
