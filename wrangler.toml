name = "mandalacodes"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# R2 bucket for the Atlas ledger (city-level world map of where every UL piece lives).
# Provisioned 2026-05-24 via `wrangler r2 bucket create mandalacodes-atlas`.
# Three JSON objects live in here:
#   atlas/ledger.json   — append-only LedgerEvent[]
#   atlas/stewards.json — private StewardRecord[] (never served publicly)
#   atlas/public.json   — derived PublicAtlasState, regenerated after every write
[[r2_buckets]]
binding = "ATLAS_BUCKET"
bucket_name = "mandalacodes-atlas"

# D1 database — provisioned 2026-05-23 via `wrangler d1 create mandalacodes-oracle`.
# Region: APAC. Backs the accounts work (Phase 1b — Clerk + birthdate energy
# panels): users + profiles + collections.
# Schema lives in migrations/001_init.sql. Apply to the remote DB with:
#   wrangler d1 migrations apply mandalacodes-oracle --remote
# The public oracle reader is stateless; only the /api/{auth,profile,collections}
# Functions and the Clerk webhook query this DB.
[[d1_databases]]
binding = "DB"
database_name = "mandalacodes-oracle"
database_id = "c8d07902-f80a-4c84-a82e-7d70dad34672"
migrations_dir = "migrations"
