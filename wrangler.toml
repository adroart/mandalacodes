name = "mandalacodes"
compatibility_date = "2024-09-23"
# Better Auth (self-owned login) uses node:crypto, exposed only behind this flag.
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[images]
binding = "IMAGES"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "mandalacodes-media"

# Historical Atlas R2 evidence, frozen 2026-08-09. Adrian-Website now owns the
# canonical collector record; Mandala's /api/atlas middleware rejects all
# mutations and GET /api/atlas proxies https://adrianrasmussen.com/api/atlas.
# ATLAS_CANONICAL_URL may override that read source in the Pages environment.
# Keep this binding only to preserve/read old evidence for explicit archival
# work. Never resume writes or treat any object here as canonical.
[[r2_buckets]]
binding = "ATLAS_BUCKET"
bucket_name = "mandalacodes-atlas"

# Private Oracle recordings and invocation artifacts. No public development URL/domain.
[[r2_buckets]]
binding = "ORACLE_PRIVATE"
bucket_name = "mandalacodes-oracle-private"

# Server-side transcription fallback. Primary provider uses the GROQ_API_KEY Pages secret.
# Fallback model: @cf/openai/whisper-large-v3-turbo.
[ai]
binding = "AI"

# D1 database — SHARED with adrianrasmussen.com as of 2026-06-09.
# Both sites run self-owned Better Auth against this one user database, so a
# collector who signs in on either domain is the same identity on both. The
# canonical schema is the SUPERSET held in the Adrian-Website repo
# (migrations/001_init.sql + 002_invoices.sql): users + profiles + collections
# (used here) plus orders/cart/invoices (used only on adrianrasmussen.com).
# Apply/evolve the schema from the Adrian-Website repo, NOT from here, so the
# two never diverge. The old mandalacodes-oracle DB (c8d07902…) is retired.
# That is now enforced rather than merely stated: this repo's migrations/ dir was
# consolidated into Adrian-Website on 2026-09-01 and removed here, so there is no
# second directory able to claim a filename in the one shared journal.
# The public oracle reader is stateless; only the /api/{auth,profile,collections}
# Functions and the atlas rate-limiter query this DB.
[[d1_databases]]
binding = "DB"
database_name = "adrian-website"
database_id = "d0e93f04-203c-4dbd-945a-e14a9a364dd5"
# No migrations_dir on purpose. Adrian-Website owns this schema and holds every
# migration for it. Two repos migrating one database share a single journal keyed
# by filename, so the first repo to use a name silently locks the other out of it,
# with no error. Consolidated 2026-09-01; see docs/d1-migrations.md.
