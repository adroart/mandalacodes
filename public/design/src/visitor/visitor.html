<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Lightweaver · Scene Control</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a12;
      --surface: #111120;
      --border:  #222236;
      --text:    #f0f0f8;
      --text-2:  #a0a0b8;
      --accent:  oklch(74% 0.13 210);
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }

    body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100%; }

    .header {
      width: 100%; padding: 20px 24px 12px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .brand-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px oklch(74% 0.13 210 / 0.7);
      flex-shrink: 0;
      animation: pulse 2.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.4;transform:scale(.9)} 50%{opacity:1;transform:scale(1.1)} }

    .brand-name { font-size: 22px; font-weight: 300; letter-spacing: -0.02em; }
    .brand-sub  { font-size: 12px; color: var(--text-2); margin-left: auto; }

    .scenes {
      width: 100%; max-width: 480px; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 12px;
    }

    .scene-btn {
      width: 100%; padding: 20px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 18px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex; align-items: center; gap: 16px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .scene-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: var(--color, #888);
      opacity: 0.08;
      transition: opacity 0.15s;
    }
    .scene-btn:active::before { opacity: 0.18; }
    .scene-btn:active { transform: scale(0.98); }
    .scene-btn.active {
      border-color: var(--color, var(--accent));
      box-shadow: 0 0 0 1px var(--color, var(--accent)), inset 0 0 0 1px var(--color, var(--accent));
    }
    .scene-btn.active::before { opacity: 0.15; }
    .scene-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--color, #888);
      flex-shrink: 0;
      box-shadow: 0 0 8px var(--color, #888);
    }
    .scene-active-badge {
      margin-left: auto; font-size: 11px; color: var(--color, var(--accent));
      font-weight: 400; opacity: 0.9;
    }

    .wled-connect {
      width: 100%; max-width: 480px; padding: 0 16px 20px;
    }
    .wled-row {
      display: flex; gap: 8px;
    }
    .wled-ip {
      flex: 1; padding: 10px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px;
      outline: none;
    }
    .wled-ip:focus { border-color: var(--accent); }
    .wled-btn {
      padding: 10px 18px;
      background: var(--accent); border: none; border-radius: 8px;
      color: #000; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .wled-status {
      margin-top: 8px; font-size: 12px; color: var(--text-2);
      display: flex; align-items: center; gap: 6px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; }

    .master-controls {
      width: 100%; max-width: 480px; padding: 0 16px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .master-row {
      display: flex; align-items: center; gap: 10px;
    }
    .master-label {
      font-size: 11px; color: var(--text-2); min-width: 60px; font-family: system-ui, sans-serif;
    }
    .master-slider {
      flex: 1; accent-color: var(--accent);
    }
    .master-val {
      font-size: 11px; color: var(--text-2); min-width: 36px; text-align: right; font-variant-numeric: tabular-nums;
    }
  </style>
  <script type="module" crossorigin src="/design/assets/visitor-CYArkZOb.js"></script>
  <link rel="modulepreload" crossorigin href="/design/assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body>
  <div class="header">
    <div class="brand-dot"></div>
    <div class="brand-name">Lightweaver</div>
    <div class="brand-sub">Scene Control</div>
  </div>

  <div class="wled-connect">
    <div class="wled-row">
      <input class="wled-ip" id="wledIp" type="text" placeholder="WLED IP (e.g. 192.168.1.42)"
             value="" inputmode="url"/>
      <button class="wled-btn" id="connectBtn">Connect</button>
    </div>
    <div class="wled-status">
      <div class="status-dot" id="statusDot" style="background:#555"></div>
      <span id="statusText">Not connected</span>
    </div>
  </div>

  <div class="master-controls" id="masterControls" style="display:none">
    <div class="master-row">
      <span class="master-label">Brightness</span>
      <input class="master-slider" id="brightnessSlider" type="range" min="0" max="255" value="128"/>
      <span class="master-val" id="brightnessVal">50%</span>
    </div>
    <div class="master-row">
      <span class="master-label">Speed</span>
      <input class="master-slider" id="speedSlider" type="range" min="0" max="255" value="128"/>
      <span class="master-val" id="speedVal">50%</span>
    </div>
  </div>

  <div class="scenes" id="scenes"></div>

</body>
</html>
