<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Send a memo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --paper: #f3efe7; --paper-deep: #e0d8c6; --ink: #2f2925; --ink-soft: #594e48; --gold: #a37b38; --line: #cfc4ad; --bad: #8a3324; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1d1a18; --paper-deep: #2a2522; --ink: #efe9df; --ink-soft: #b9ada3; --gold: #c99c55; --line: #4a413b; --bad: #e08a74; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.5 Georgia, "Iowan Old Style", "Times New Roman", serif; }
  main { max-width: 34rem; margin: 0 auto; padding: max(1.25rem, env(safe-area-inset-top)) 1rem 3rem; }
  h1 { font-weight: 400; font-size: 1.9rem; margin: .5rem 0 .25rem; letter-spacing: .01em; }
  p.lede { margin: 0 0 1.5rem; color: var(--ink-soft); }
  label { display: block; font: 600 .78rem/1.2 -apple-system, "Segoe UI", sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin: 1.25rem 0 .4rem; }
  input[type=text] { width: 100%; padding: .7rem .75rem; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 4px; }
  .pick { display: flex; align-items: center; gap: .75rem; padding: .85rem .75rem; border: 1px dashed var(--line); border-radius: 4px; cursor: pointer; }
  .pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .pick span { color: var(--ink-soft); }
  .hint { margin: .35rem 0 0; font: .85rem/1.4 -apple-system, "Segoe UI", sans-serif; color: var(--ink-soft); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.5rem, 1fr)); gap: .4rem; margin-top: .5rem; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 3px; background: var(--paper-deep); }
  button { margin-top: 1.75rem; width: 100%; padding: .95rem; font: 600 1rem/1 -apple-system, "Segoe UI", sans-serif; color: var(--paper); background: var(--ink); border: 0; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #log { margin: 1rem 0 0; padding: 0; list-style: none; font: .92rem/1.45 -apple-system, "Segoe UI", sans-serif; color: var(--ink-soft); }
  #log li.bad { color: var(--bad); }
  h2 { font-weight: 400; font-size: 1.25rem; margin: 2.5rem 0 .5rem; border-top: 1px solid var(--line); padding-top: 1.25rem; }
  .memo { padding: .75rem 0; border-bottom: 1px solid var(--line); }
  .memo .meta { font: .85rem/1.4 -apple-system, "Segoe UI", sans-serif; color: var(--ink-soft); }
  .memo .state { color: var(--gold); }
  .memo pre { white-space: pre-wrap; font: .95rem/1.55 Georgia, serif; margin: .5rem 0 0; max-height: 14rem; overflow: auto; }
  .signin { padding: 1rem; border: 1px solid var(--line); border-radius: 4px; }
  a { color: var(--gold); }
</style>
</head>
<body>
<main>
  <h1>Send a memo</h1>
  <p class="lede">A voice memo and its photos, for AR Create. Claude picks it up from here, even with the Mac asleep.</p>

  <div id="signin" class="signin" hidden>This page is private. <a href="/">Sign in on mandalacodes.com</a>, then come back.</div>

  <form id="send" autocomplete="off">
    <label for="title">What it is about (optional)</label>
    <input id="title" type="text" maxlength="120" placeholder="Yingge kiln visit">

    <label>Recording</label>
    <label class="pick" for="audio" style="text-transform:none;letter-spacing:0;font:inherit;margin:0">
      <input id="audio" type="file" accept="audio/*,.m4a,.mp3,.wav,.aac">
      <span id="audioName">Choose the voice memo</span>
    </label>
    <p class="hint">In Voice Memos: Share → Save to Files, then choose it here.</p>

    <label>Photos</label>
    <label class="pick" for="photos" style="text-transform:none;letter-spacing:0;font:inherit;margin:0">
      <input id="photos" type="file" accept="image/jpeg,image/png,image/heic,image/heif,image/webp" multiple>
      <span id="photosName">Choose photos, up to 20</span>
    </label>
    <div id="thumbs" class="thumbs"></div>

    <button id="go" type="submit" disabled>Send</button>
    <ul id="log" aria-live="polite"></ul>
  </form>

  <h2>Sent</h2>
  <div id="memos"><p class="meta">Nothing yet.</p></div>
</main>
<script src="/memo/memo.js" defer></script>
</body>
</html>
