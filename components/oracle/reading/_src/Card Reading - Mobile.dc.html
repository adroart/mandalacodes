      </a>
      <button type="button" aria-label="Account" style="background:none;border:0;cursor:pointer;padding:8px;display:flex;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#cdc0a8" stroke-width="1.6"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"></path></svg>
      </button>
    </header>

    <!-- body scroller -->
    <div data-reader="" style="flex:1;min-height:0;position:relative;">
      <main data-scroll="" style="position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px;">

        <!-- sticky pill jump bar (top) -->
        <div data-jumpbar="" style="position:sticky;top:0;z-index:5;overflow:hidden;background:#191510cc;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(168,135,77,.16);">
          <span data-progressfill-h="" style="position:absolute;left:0;top:0;height:1px;width:0;background:linear-gradient(to right,rgba(198,166,103,.08),rgba(222,188,126,.6));z-index:2;transition:width .12s linear;"></span>
          <span data-comet="" style="position:absolute;left:0;top:0.5px;width:5px;height:5px;transform:translate(-50%,-50%) rotate(45deg);border-radius:1px;background:#d9c290;box-shadow:0 0 5px 1px rgba(217,194,144,.4);z-index:3;transition:left .12s linear;"></span>
          <div data-pills="" style="display:flex;padding:12px 12px;">
            <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6"><button type="button" data-nav="{{ n.id }}" style="flex:1 1 0;min-width:0;background:none;border:0;cursor:pointer;padding:6px 2px;font-family:'Iowan Old Style Web',serif;font-size:9px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#80735f;white-space:nowrap;text-align:center;transition:color .3s ease,transform .35s cubic-bezier(.4,0,.2,1);transform-origin:center;">{{ n.tab }}</button></sc-for>
          </div>
        </div>

        <!-- HERO: framed mandala plate (title + keywords live in the reading below) -->
        <div style="padding: 16px 22px 0; padding-top: 15px">
          <div style="position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:12px;background:#14100b;">
            <div data-artparallax="" style="position:absolute;inset:0;transform:scale(1.03);transform-origin:center;will-change:transform;">
              <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="art-mobile" fit="cover" placeholder="Drop the mandala artwork" hint-size="100%,100%"></x-import>
            </div>
          </div>
        </div>

        <!-- reading -->
        <div style="width:100%;--read-pad:22px;--hero-dir:column;--hero-justify:center;--hero-align:center;--hero-size:38px;--hero-glyph:34px;--kw-size:16px;--cta-display:flex;--hero-top:14px;">
          <dc-import name="Reading" hint-size="100%,2600px"></dc-import>
        </div>
      </main>
    </div>

    <!-- bottom tab bar -->
    <footer style="position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:stretch;height:72px;padding-bottom:8px;border-top:1px solid rgba(168,135,77,.16);background:rgba(22,16,9,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5"><a href="#top" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:{{ t.color }};" data-tab="{{ t.id }}">
        <span data-tabicon="" style="display:flex;"></span>
        <span style="font-family:'Iowan Old Style Web',serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;">{{ t.label }}</span>
      </a></sc-for>
    </footer>

    <!-- home indicator -->
    <div style="position:absolute;left:50%;bottom:8px;z-index:7;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:rgba(243,236,222,.28);"></div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      nav: [
        {id:"ul", tab:"UL"},
        {id:"iching", tab:"I Ching"},
        {id:"genekeys", tab:"Gene Keys"},
        {id:"humandesign", tab:"H. Design"},
        {id:"body", tab:"Body"},
        {id:"relations", tab:"Relations"}
      ],
      tabs: [
        {id:"family", label:"Family", color:"#80735f"},
        {id:"forme", label:"For Me", color:"#80735f"},
        {id:"deck", label:"The 64", color:"#c6a667"},
        {id:"piece", label:"Piece", color:"#80735f"},
        {id:"share", label:"Share", color:"#80735f"}
      ]
    };
  }

  componentDidMount() {
    this._icons = {
      family:'<svg width="22" height="22" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="13" cy="15" r="4"/><circle cx="27" cy="15" r="4"/><path d="M6 30c0-4 3.5-7 7-7s7 3 7 7M20 30c0-4 3.5-7 7-7s7 3 7 7"/></svg>',
      forme:'<svg width="22" height="22" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="20" cy="20" r="13"/><circle cx="20" cy="20" r="4"/><path d="M20 7v5M20 28v5M7 20h5M28 20h5"/></svg>',
      deck:'<svg width="22" height="22" viewBox="0 0 40 40" fill="currentColor"><g><circle cx="11" cy="11" r="1.7"/><circle cx="20" cy="11" r="1.7"/><circle cx="29" cy="11" r="1.7"/><circle cx="11" cy="20" r="1.7"/><circle cx="20" cy="20" r="1.7"/><circle cx="29" cy="20" r="1.7"/><circle cx="11" cy="29" r="1.7"/><circle cx="20" cy="29" r="1.7"/><circle cx="29" cy="29" r="1.7"/></g></svg>',
      piece:'<svg width="22" height="22" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="8" y="9" width="24" height="22"/><path d="M8 9l12 11 12-11"/></svg>',
      share:'<svg width="22" height="22" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M10 30c0-9 6-13 15-13M18 10l8 7-8 7"/></svg>'
    };
    this._wired = new WeakSet();
    let tries = 0;
    const tick = () => {
      let pending = false;
      document.querySelectorAll('[data-tab]').forEach((a) => {
        const slot = a.querySelector('[data-tabicon]');
        if (slot && !slot.innerHTML) { const ic = this._icons[a.getAttribute('data-tab')]; if (ic) slot.innerHTML = ic; }
      });
      const readers = document.querySelectorAll('[data-reader]');
      readers.forEach((reader) => {
        if (this._wired.has(reader)) return;
        const ready = reader.querySelector('[data-scroll]')
          && reader.querySelectorAll('[data-sec]').length >= 6
          && reader.querySelectorAll('[data-nav]').length;
        if (ready) { this._wired.add(reader); this.wireReader(reader); }
        else pending = true;
      });
      if ((pending || readers.length === 0) && tries++ < 160) this._timer = setTimeout(tick, 120);
    };
    tick();
  }

  componentWillUnmount() { if (this._timer) clearTimeout(this._timer); if (this._anim) clearInterval(this._anim); }

  wireReader(reader) {
    const scroll = reader.querySelector('[data-scroll]');
    if (!scroll) return;
    const navs = Array.from(reader.querySelectorAll('[data-nav]'));
    const pills = reader.querySelector('[data-pills]');
    const jb = reader.querySelector('[data-jumpbar]');
    const hfill = reader.querySelector('[data-progressfill-h]');
    const comet = reader.querySelector('[data-comet]');
    const artPar = reader.querySelector('[data-artparallax]');
    if (!navs.length) return;

    const setActive = (idx) => {
      navs.forEach((n, i) => {
        n.style.color = i === idx ? '#c6a667' : '#80735f';
        n.style.transform = i === idx ? 'scale(1.05)' : 'scale(1)';
      });
    };

    let secList = [];
    let breaks = [];
    const layout = () => {
      const sTop = scroll.getBoundingClientRect().top;
      secList = navs.map((n) => {
        const id = n.getAttribute('data-nav');
        const sec = reader.querySelector('[data-sec="' + id + '"]');
        const top = sec ? (sec.getBoundingClientRect().top - sTop + scroll.scrollTop) : 0;
        return { id, top, btn: n };
      }).sort((a, b) => a.top - b.top);
      breaks = secList.map((s) => s.top);
      const jbLeft = jb ? jb.getBoundingClientRect().left : 0;
      secList.forEach((s) => { const rr = s.btn.getBoundingClientRect(); const padL = parseFloat(getComputedStyle(s.btn).paddingLeft) || 0; s.cx = rr.left - jbLeft + padL; });
    };

    let lastActive = -1;
    const onScroll = () => {
      layout();
      const n = breaks.length;
      if (!n) return;
      const pos = scroll.scrollTop;
      if (artPar) artPar.style.transform = 'scale(1.12) translateY(' + (pos * 0.12) + 'px)';
      const den = Math.max(1, scroll.scrollHeight - scroll.clientHeight);
      const frac = Math.max(0, Math.min(1, pos / den));
      // comet rides the fixed-width sub-bar; clamp so it never leaves the frame
      const barW = pills ? pills.clientWidth : 0;
      const x = Math.max(4, Math.min(frac * barW, barW - 4));
      if (hfill) hfill.style.width = (frac * barW) + 'px';
      if (comet) comet.style.left = x + 'px';
      let ak = 0;
      const jumpTop = jb ? jb.getBoundingClientRect().height : 0;
      for (let i = 0; i < n; i++) { if (pos + jumpTop + 20 >= breaks[i]) ak = i; }
      const idx = navs.indexOf(secList[ak].btn);
      if (idx !== lastActive) { lastActive = idx; setActive(idx); }
    };

    layout();
    onScroll();
    scroll.addEventListener('scroll', onScroll, { passive: true });
    setTimeout(() => { layout(); onScroll(); }, 500);
    setTimeout(() => { layout(); onScroll(); }, 1400);
    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(() => { layout(); onScroll(); });
      ro.observe(scroll); ro.observe(reader);
    }

    const smoothTo = (to) => {
      const start = scroll.scrollTop;
      const dist = to - start;
      const dur = 500;
      const t0 = Date.now();
      const ease = (p) => 1 - Math.pow(1 - p, 3);
      if (this._anim) clearInterval(this._anim);
      this._anim = setInterval(() => {
        const p = Math.min(1, (Date.now() - t0) / dur);
        scroll.scrollTop = start + dist * ease(p);
        onScroll();
        if (p >= 1) { clearInterval(this._anim); this._anim = null; }
      }, 16);
    };
    reader.addEventListener('click', (e) => {
      const btn = e.target.closest && e.target.closest('[data-nav]');
      if (!btn || !reader.contains(btn)) return;
      const target = reader.querySelector('[data-sec="' + btn.getAttribute('data-nav') + '"]');
      if (!target) return;
      const jumpH = jb ? jb.getBoundingClientRect().height : 0;
      const top = target.getBoundingClientRect().top - scroll.getBoundingClientRect().top + scroll.scrollTop - jumpH - 8;
      const max = scroll.scrollHeight - scroll.clientHeight;
      smoothTo(Math.max(0, Math.min(top, max)));
    });
  }
}
</script>
</body>
