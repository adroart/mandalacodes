const sections=[{"title": "The drive — Gate 2, Direction of the Self", "short": "The drive", "original": ["You feel where your life is heading before you have chosen it. Gate 2 is the name for that pull, and it sits in the middle of your chest. It does not make the road. It feels where the road already goes, and what belongs on that road comes toward you. A field knows which way is downhill without measuring anything, and you know your direction like that. If someone asks why you are going this way, you can only say that it is the way.", "To anyone watching, this can look like waiting. Nobody sees a direction arriving, so they see you not deciding and call it drift. The cost sits somewhere else. You take it all on alone and settle for less than you wanted, because you did not trust that help would come. Let the direction find you, and let the help in with it."], "spoken": ["I can feel where my life is going before I can explain it. Gate two is that quiet sense of direction. I don’t need to force the road into existence. I need to listen for what belongs on it.", "From the outside, that can look like I’m doing nothing. But I’m learning to let the direction arrive, and to let people help me instead of carrying everything alone."]}, {"title": "Where it lives — the Identity Center", "short": "Where it lives", "original": ["The Identity centre holds who you are and which way your life faces, and those turn out to be one thing. It makes nothing of its own. It works like a magnet with a single pole, which only ever draws. What your life needs comes toward it, the people as much as the work. The direction of a life is the sum of what it drew in. Trust it and you go where you were already being taken. When you do not, you end up at war with what it was bringing you.", "About six people in ten have this centre running on its own, and their sense of self stays put whoever they are with. They have a direction that holds across years. What starves them is walking another person's road, and long enough on it they lose heart. The other four take their sense of self from whoever stands closest, and let it go when that person leaves. They may have lived several lives inside one life. Place matters more to them than anything. The wrong house or the wrong seat in a room can put them out of themselves. The right ground gives them back to themselves. Where they are is where they were going, and the one wrong turn they can take is trying to become somebody."], "spoken": ["For me, identity and direction are connected. The place I am in and the people around me affect how clearly I can feel my own way.", "I know when I am trying to live somebody else’s life. I lose that sense of direction. The right environment helps me come back to myself."]}, {"title": "What completes it — the Channel of the Beat (2–14)", "short": "What completes it", "original": ["A direction with nobody walking it stays a heading. What walks it is Gate 14, low in the belly, the drive that works and makes more than one person needs. Put the two together and they form the Channel of the Beat, a direction with the power to follow it. The beat belongs to nobody else, and what the work brings in is usually for other people too. Gate 14 may sit in you or in a person close to you, and the channel runs only when both are present."], "spoken": ["Direction needs energy behind it. Gate fourteen gives the work and the resources a way to move. Together, the two make a direction that can actually be lived."]}];

 let pending=null;const a=root.querySelector('.original'),b=root.querySelector('.spoken');if(a&&b){const sync=(from,to)=>{if(!linked)return;if(pending===from){pending=null;return;}const progress=from.scrollTop/Math.max(1,from.scrollHeight-from.clientHeight);const next=progress*Math.max(0,to.scrollHeight-to.clientHeight);if(Math.abs(next-to.scrollTop)>1){pending=to;to.scrollTop=next;}};a.onscroll=()=>sync(a,b);b.onscroll=()=>sync(b,a);}
 }
 render();

let choice=new URLSearchParams(location.search).get('option')||'a';if(!definitions[choice])choice='a';function show(){document.getElementById('preview').srcdoc=inner(choice);document.getElementById('design-name').textContent=definitions[choice].name;document.getElementById('description').textContent=definitions[choice].description;document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.option===choice)));history.replaceState(null,'','?option='+choice+(document.body.classList.contains('phone')?'&phone=1':''));}document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{choice=b.dataset.option;show()});for(const size of ['phone','desktop'])document.getElementById(size).onclick=()=>{document.body.classList.toggle('phone',size==='phone');document.getElementById('phone').setAttribute('aria-pressed',String(size==='phone'));document.getElementById('desktop').setAttribute('aria-pressed',String(size==='desktop'));};if(new URLSearchParams(location.search).has('phone'))document.body.classList.add('phone');if(new URLSearchParams(location.search).has('board')){document.body.classList.add('board');document.getElementById('canvas').innerHTML=Object.entries(definitions).map(([key,d])=>'<section class="board-item"><h2>'+d.name+'</h2><p>'+d.description+'</p><iframe title="'+d.name+'" id="frame-'+key+'"></iframe></section>').join('');Object.keys(definitions).forEach(key=>document.getElementById('frame-'+key).srcdoc=inner(key));}else show();
